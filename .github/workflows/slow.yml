name: slow

# The opt-in checks the per-push suite skips: FDIA_SLOW=1 downloads the real IEEE-118 timeline and
# sanity-checks the estimators on it. Weekly, and on demand from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install package with the generate, se, torch and test extras
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[generate,se,federated,test]" torch_geometric matplotlib
      - name: Run the slow checks
        env:
          FDIA_SLOW: "1"
        run: pytest -q tests -k ieee118
