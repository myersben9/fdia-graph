# Publish fdia-graph to PyPI automatically when a version tag is pushed.
#
# Flow: bump `version` in pyproject.toml (+ __init__), merge to main, then push the matching tag:
#     git tag vX.Y.Z && git push origin vX.Y.Z
# This workflow builds the sdist+wheel, verifies the tag matches the pyproject version (so a stale
# tag can never publish the wrong code), and uploads via PyPI Trusted Publishing (OIDC) -- no API
# token is stored in GitHub or anywhere else.
#
# DATA-release tags (e.g. a v0.7.2 dataset release cut via the API) also match "v*" but are not
# package releases: the version job makes the tests and publish jobs SKIP quietly for them.
#
# ONE-TIME SETUP on PyPI (repo owner): pypi.org -> project fdia-graph -> Settings -> Publishing ->
# "Add a new publisher" -> GitHub: owner=myersben9, repo=fdia-graph, workflow=publish.yml.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  # Package tag or data tag: only a tag equal to the pyproject version is a package release.
  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Check tag against pyproject version
        id: ver
        run: |
          PYVER="$(python3 -c "import re;print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject=$PYVER tag=$TAG"
          if [ "$PYVER" = "$TAG" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tag v$TAG is not package version $PYVER — data release, skipping PyPI publish"
          fi

  # The suite on the tagged commit: a package tag on a commit whose tests fail never publishes.
  tests:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install package with the generate, se, torch and test extras
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[generate,se,test]" torch_geometric matplotlib
      - name: Run the test suite
        run: pytest -q tests

  publish:
    needs: [version, tests]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
