# Publish fdia-graph to PyPI automatically when a version tag is pushed.
#
# Flow: bump `version` in pyproject.toml (+ __init__), merge to main, then push the matching tag:
#     git tag vX.Y.Z && git push origin vX.Y.Z
# This workflow builds the sdist+wheel, verifies the tag matches the pyproject version (so a stale
# tag can never publish the wrong code), and uploads via PyPI Trusted Publishing (OIDC) -- no API
# token is stored in GitHub or anywhere else.
#
# DATA-release tags (e.g. a v0.7.2 dataset release cut via the API) also match "v*" but are not
# package releases: the version check makes the run SKIP quietly instead of failing red.
#
# ONE-TIME SETUP on PyPI (repo owner): pypi.org -> project fdia-graph -> Settings -> Publishing ->
# "Add a new publisher" -> GitHub: owner=myersben9, repo=fdia-graph, workflow=publish.yml.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag against pyproject version
        id: ver
        run: |
          PYVER="$(python -c "import re;print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject=$PYVER tag=$TAG"
          if [ "$PYVER" = "$TAG" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tag v$TAG is not package version $PYVER — data release, skipping PyPI publish"
          fi

      - name: Build sdist + wheel
        if: steps.ver.outputs.publish == 'true'
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.ver.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
