name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install-and-import:
    # Python 3.9 runs on ubuntu-24.04, not ubuntu-latest: once ubuntu-latest became 26.04
    # (November 2026), setup-python had no Python 3.9 build for the image and every 3.9 job
    # failed at setup. 3.12 stays on ubuntu-latest, so the install is still tried on the newest image.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # The generation toolkit first, alone: it must import with the analysis toolkit absent.
      - name: Install fdia-graph
        run: pip install .
      - name: Import and registry smoke test, without fdia-analysis
        run: |
          python -c "import fdia_graph as fg; print(fg.__version__)"
          python -c "from fdia_graph import registry; print(registry._RELEASE)"
          python -c "import importlib.util as u; assert u.find_spec('fdia_analysis') is None"
      # every module of fdia_graph that needs no optional extra imports here, with fdia_analysis
      # blocked in the interpreter that imports them (the test's own walk)
      - name: Every module of fdia_graph imports without fdia-analysis
        run: |
          pip install pytest
          pytest -q tests/test_toolkit_boundary.py
      # Then the analysis toolkit on top of it: its fdia-graph requirement is met by the install above.
      - name: Install fdia-analysis
        run: pip install ./analysis
      - name: Import smoke test of the analysis toolkit
        run: python -c "import fdia_analysis, fdia_analysis.results, fdia_analysis.localization; print(fdia_analysis.__version__)"

  # Whether the change touches anything the test suite exercises. A pull request whose changed files
  # are all Markdown or under docs/ skips the three suites' install and run steps; the jobs still run
  # and report success, so tools/pr.py's merge rule (every smoke job green on the head) holds. The
  # data dictionary is the exception: tests/test_models_doc.py checks it against the models.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # --no-renames lists a rename as its old and its new path, so moving a tested file out counts
          changed=$(git diff --name-only --no-renames "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          code_files=$(grep -vE '^docs/|\.md$' <<< "$changed" || true)
          if [ -z "$changed" ] || [ -n "$code_files" ] || grep -qx 'docs/reference/DATA_DICTIONARY.md' <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The pip cache is kept for the three test jobs alone: setup-python keys it on OS, Python and
  # the two pyproject.toml files, so a lighter job on the same Python would save its small cache under that key first.
  # Each job installs both toolkits from this checkout (the generation toolkit `fdia-graph` at the root,
  # the analysis toolkit `fdia-analysis` in analysis/) and runs both test trees.
  # A skipped suite leaves no pip cache on disk, which setup-python's save step fails on, so it caches
  # only when the suite runs.
  tests:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: ${{ needs.changes.outputs.code == 'true' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            analysis/pyproject.toml
      # CPU-only torch keeps the job small; pandapower builds the tests' own tiny timeline (no timeline
      # download, only the operating-point pool). torch_geometric is pure Python. [se] is named so a
      # dependency it adds (scipy) is installed as a user gets it, not only through pandapower.
      - name: Install both toolkits with the generate, se, federated and test extras
        if: needs.changes.outputs.code == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[generate,test]" -e "./analysis[se,federated,test]" torch_geometric matplotlib pytest-cov
      - name: Run both test suites with coverage
        if: needs.changes.outputs.code == 'true'
        run: pytest -q -n auto tests analysis/tests --cov=fdia_graph --cov=fdia_analysis --cov-report=term-missing:skip-covered

  # The lowest supported Python and the maintainers' OS run the full suite too: install-and-import
  # alone let a 3.9-only or Windows-only failure through.
  tests-py39:
    name: tests (3.9)
    needs: changes
    runs-on: ubuntu-24.04  # see install-and-import
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.9"
          cache: ${{ needs.changes.outputs.code == 'true' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            analysis/pyproject.toml
      - name: Install both toolkits with the generate, se, federated and test extras
        if: needs.changes.outputs.code == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[generate,test]" -e "./analysis[se,federated,test]" torch_geometric matplotlib
      - name: Run both test suites
        if: needs.changes.outputs.code == 'true'
        run: pytest -q -n auto tests analysis/tests

  tests-windows:
    name: tests (windows)
    needs: changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: ${{ needs.changes.outputs.code == 'true' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            analysis/pyproject.toml
      - name: Install both toolkits with the generate, se, federated and test extras
        if: needs.changes.outputs.code == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[generate,test]" -e "./analysis[se,federated,test]" torch_geometric matplotlib
      - name: Run both test suites
        if: needs.changes.outputs.code == 'true'
        run: pytest -q -n auto tests analysis/tests

  typecheck:
    runs-on: ubuntu-24.04  # Python 3.9, see install-and-import
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.9"
      # Only numpy (the well-typed hard dependency) + pyright are installed. The optional heavy stack
      # (torch/pandas/pandapower/h5py/torch_geometric/gridstatus/tensorflow) is imported lazily and
      # left unresolved on purpose (see [tool.pyright] in pyproject.toml); the check enforces that the
      # SDK's own type annotations are present and self-consistent. Fails on any pyright error.
      - name: Install pyright
        run: pip install numpy pyright
      - name: Type-check both packages
        run: pyright src/fdia_graph analysis/src/fdia_analysis

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Check formatting (ruff format)
        run: ruff format --check src/fdia_graph analysis/src/fdia_analysis conftest.py tests analysis/tests tools pipelines
      - name: "Lint (ruff check: pyflakes, import order, modern syntax)"
        run: ruff check src analysis/src conftest.py tests analysis/tests tools pipelines

  readability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the gate diffs against the base branch
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install radon and the packages' core dependencies (the results check imports both from this checkout)
        run: pip install radon numpy h5py requests tqdm
      # The report covers both packages and never fails; it is the readability backlog.
      # The gate fails only when a function this change touched is
      # outside a limit and not on the exceptions list in tools/readability.py.
      - name: Readability report
        run: python tools/readability.py --report
      - name: Class and module diagram sources match the code
        run: python tools/class_diagrams.py --check
      - name: Layout (names, docstrings, package pages, cited names, the file map)
        run: python tools/layout.py --check
      - name: Results blocks match the results store
        run: python tools/results_docs.py --check
      - name: Readability gate on touched functions
        if: github.event_name == 'pull_request'
        run: python tools/readability.py --check --base origin/${{ github.base_ref }}
