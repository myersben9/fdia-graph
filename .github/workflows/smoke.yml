name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install-and-import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install .
      - name: Import and registry smoke test
        run: |
          python -c "import fdia_graph as fg; print(fg.__version__)"
          python -c "from fdia_graph import registry; print(registry._RELEASE)"
