name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install-and-import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install .
      - name: Import and registry smoke test
        run: |
          python -c "import fdia_graph as fg; print(fg.__version__)"
          python -c "from fdia_graph import registry; print(registry._RELEASE)"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU-only torch keeps the job small; pandapower builds the tests' own tiny shard (no shard
      # download, only the 13 MB operating-point pool). torch_geometric is pure Python.
      - name: Install package with the generate, torch and test extras
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[generate,test]" torch_geometric matplotlib
      - name: Run the test suite
        run: pytest -q tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      # Only numpy (the well-typed hard dependency) + pyright are installed. The optional heavy stack
      # (torch/pandas/pandapower/h5py/torch_geometric/gridstatus/tensorflow) is imported lazily and
      # left unresolved on purpose (see [tool.pyright] in pyproject.toml); the check enforces that the
      # SDK's own type annotations are present and self-consistent. Fails on any pyright error.
      - name: Install pyright
        run: pip install numpy pyright
      - name: Type-check src/fdia_graph
        run: pyright src/fdia_graph

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Check formatting (ruff format)
        run: ruff format --check src/fdia_graph
