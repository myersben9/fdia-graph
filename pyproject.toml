[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdia-graph"
version = "0.7.8"
description = "Load and generate ML-only dangerous FDIA localization datasets (realistic measurement graphs) for power grids, PyTorch-ready."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
# name-only entry fills the legacy Author field (some indexers read only that);
# the name+email entry fills Author-email per PEP 621
authors = [
  { name = "Benjamin Myers" },
  { name = "Benjamin Myers", email = "benjamin.myers.465@my.csun.edu" },
]
keywords = ["power-systems", "false-data-injection", "FDIA", "state-estimation", "graph-neural-network", "smart-grid", "dataset"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.21",
  "h5py>=3.6",
  "requests>=2.25",
  "tqdm>=4.60",
]

[project.optional-dependencies]
torch = ["torch>=1.12"]
pyg = ["torch>=1.12", "torch_geometric>=2.2"]
generate = ["pandapower>=2.10", "pandas>=1.3"]   # dataset generation + load-profile ingestion (needs a power-flow engine)
iso = ["gridstatus>=0.25", "pandas>=1.3"]        # auto-download CAISO/ERCOT load profiles (NYISO works without it)
all = ["torch>=1.12", "torch_geometric>=2.2", "pandapower>=2.10", "pandas>=1.3", "gridstatus>=0.25"]

[project.urls]
Homepage = "https://github.com/myersben9/fdia-graph"
Repository = "https://github.com/myersben9/fdia-graph"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fdia_graph = ["profiles/*.npz"]

# Static type checking, scoped to the SDK package (enforced in CI, see .github/workflows/smoke.yml).
# The optional heavy stack (torch/pandas/pandapower/h5py/torch_geometric/gridstatus/tensorflow) is
# imported lazily and not installed in the type-check job, so its missing imports are not errors; the
# check enforces that the SDK's own annotations are present and self-consistent.
[tool.pyright]
include = ["src/fdia_graph"]
typeCheckingMode = "basic"
pythonVersion = "3.9"
reportMissingImports = false
reportMissingModuleSource = false

[tool.ruff]
line-length = 110
target-version = "py39"
