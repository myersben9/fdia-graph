[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdia-graph"
version = "0.21.0"
description = "Build attacked measurement timelines on power-grid test systems: download a ready timeline or generate your own."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
# name-only entry fills the legacy Author field (some indexers read only that);
# the name+email entry fills Author-email per PEP 621
authors = [
  { name = "Benjamin Myers" },
  { name = "Benjamin Myers", email = "benjamin.myers.465@my.csun.edu" },
]
keywords = ["power-systems", "false-data-injection", "FDIA", "state-estimation", "graph-neural-network", "smart-grid", "dataset"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.21",
  "h5py>=3.6",
  "requests>=2.25",
  "tqdm>=4.60",
]

[project.optional-dependencies]
torch = ["torch>=1.12"]
pyg = ["torch>=1.12", "torch_geometric>=2.2"]
generate = ["pandapower>=2.10", "pandas>=1.3", "scipy>=1.8", "threadpoolctl>=3.0"]   # dataset generation + load-profile ingestion (needs a power-flow engine)
iso = ["gridstatus>=0.25", "pandas>=1.3"]        # auto-download CAISO/ERCOT load profiles (NYISO works without it)
ny = ["pandapower>=3.4", "pandas>=1.3", "scipy>=1.8", "pyomo>=6.7", "openpyxl>=3", "matpowercaseframes>=2.1"]  # the New York grid build (fdia_graph.data) (matpowercaseframes reads its MATPOWER case file); Pyomo needs the Ipopt binary (conda-forge ipopt)
all = ["torch>=1.12", "torch_geometric>=2.2", "pandapower>=3.4", "pandas>=1.3", "scipy>=1.8", "gridstatus>=0.25", "threadpoolctl>=3.0", "pyomo>=6.7", "openpyxl>=3", "matpowercaseframes>=2.1"]
test = ["pytest>=7", "pytest-xdist>=3"]  # the tests build their own tiny timeline, so they also need [generate]
dev = ["pytest>=7", "pytest-xdist>=3", "radon>=6", "ruff", "pyright", "requests"]  # readability.py needs radon, pr.py needs requests

[project.urls]
Homepage = "https://github.com/myersben9/fdia-graph"
Repository = "https://github.com/myersben9/fdia-graph"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fdia_graph = ["ratings/*.json", "data/*.csv", "systems/*.m"]

# The two toolkits of this repository are tested from its root: this checkout's own source of both is
# imported (an installed copy cannot stand in for it), the root `conftest.py` holds the fixtures the two
# test trees share, and the root is on the path for their helpers (`tests/helpers.py`). The analysis toolkit (`analysis/`, the distribution
# fdia-analysis) has its own pyproject.toml; its extras hold what only it needs (`se`, `federated`).
[tool.pytest.ini_options]
testpaths = ["tests", "analysis/tests"]
pythonpath = ["src", "analysis/src", "."]

# Static type checking, scoped to the two packages (enforced in CI, see .github/workflows/smoke.yml).
# The optional heavy stack (torch/pandas/pandapower/h5py/torch_geometric/gridstatus/tensorflow) is
# imported lazily and not installed in the type-check job, so its missing imports are not errors; the
# check enforces that the SDK's own annotations are present and self-consistent.
[tool.pyright]
include = ["src/fdia_graph", "analysis/src/fdia_analysis"]
extraPaths = ["src", "analysis/src"]
typeCheckingMode = "basic"
pythonVersion = "3.9"
reportMissingImports = false
reportMissingModuleSource = false

[tool.ruff]
line-length = 110
target-version = "py39"
src = [".", "src", "analysis/src"]  # both toolkits are first-party in the import order

[tool.ruff.lint]
select = ["F", "I", "UP"]  # pyflakes, import order, modern syntax; `ruff check src tests tools pipelines` runs in CI
# Keep Optional[X] / Union[X, Y]: the package supports 3.9, where typing.get_type_hints cannot
# evaluate the postponed "X | None" string (PEP 604 is 3.10+). list[int] and dict[str, X] are fine on 3.9.
ignore = ["UP007", "UP045"]
