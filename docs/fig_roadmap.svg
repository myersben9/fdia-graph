<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Helvetica,Arial,sans-serif">
  <rect width="780" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#444444"/>
    </marker>
  </defs>

  <!-- public API -->
  <rect x="300" y="16" width="180" height="42" rx="6" fill="#eef2f7" stroke="#444444"/>
  <text x="390" y="34" text-anchor="middle" font-size="14" fill="#111111">fg.* public API</text>
  <text x="390" y="50" text-anchor="middle" font-size="11" fill="#555555" font-family="Consolas,monospace">__init__.py</text>

  <!-- load path -->
  <text x="20" y="112" font-size="12" fill="#333333" font-family="Consolas,monospace">fg.load()</text>
  <rect x="180" y="90" width="130" height="34" rx="6" fill="#f2f2f2" stroke="#444444"/>
  <text x="245" y="111" text-anchor="middle" font-size="12" fill="#111111" font-family="Consolas,monospace">registry.py</text>
  <line x1="312" y1="107" x2="366" y2="107" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="370" y="90" width="130" height="34" rx="6" fill="#f2f2f2" stroke="#444444"/>
  <text x="435" y="111" text-anchor="middle" font-size="12" fill="#111111" font-family="Consolas,monospace">download.py</text>
  <line x1="502" y1="107" x2="556" y2="107" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="560" y="90" width="130" height="34" rx="6" fill="#f2f2f2" stroke="#444444"/>
  <text x="625" y="111" text-anchor="middle" font-size="12" fill="#111111" font-family="Consolas,monospace">dataset.py</text>

  <!-- generate path -->
  <text x="20" y="184" font-size="12" fill="#333333" font-family="Consolas,monospace">fg.generate()</text>
  <rect x="180" y="162" width="130" height="34" rx="6" fill="#f2f2f2" stroke="#444444"/>
  <text x="245" y="183" text-anchor="middle" font-size="12" fill="#111111" font-family="Consolas,monospace">profiles.py</text>
  <line x1="312" y1="179" x2="366" y2="179" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="370" y="162" width="130" height="34" rx="6" fill="#f2f2f2" stroke="#444444"/>
  <text x="435" y="183" text-anchor="middle" font-size="12" fill="#111111" font-family="Consolas,monospace">generation.py</text>
  <line x1="502" y1="179" x2="556" y2="179" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="560" y="162" width="130" height="34" rx="6" fill="#fff3d6" stroke="#444444"/>
  <text x="625" y="176" text-anchor="middle" font-size="12" fill="#111111" font-family="Consolas,monospace">engine/</text>
  <text x="625" y="190" text-anchor="middle" font-size="9" fill="#555555">physics + meters + attacks</text>

  <!-- generate writes the shard the load path serves -->
  <line x1="400" y1="162" x2="270" y2="126" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="298" y="146" font-size="10" fill="#666666">.h5 shard</text>

  <!-- stream path -->
  <text x="20" y="248" font-size="12" fill="#333333" font-family="Consolas,monospace">fg.load_stream()</text>
  <text x="20" y="262" font-size="12" fill="#333333" font-family="Consolas,monospace">fg.pyg_stream()</text>
  <rect x="180" y="234" width="130" height="34" rx="6" fill="#f2f2f2" stroke="#444444"/>
  <text x="245" y="255" text-anchor="middle" font-size="12" fill="#111111" font-family="Consolas,monospace">streams.py</text>
  <line x1="312" y1="251" x2="366" y2="251" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="370" y="234" width="130" height="34" rx="6" fill="#f2f2f2" stroke="#444444"/>
  <text x="435" y="248" text-anchor="middle" font-size="12" fill="#111111" font-family="Consolas,monospace">torch_data.py</text>
  <text x="435" y="262" text-anchor="middle" font-size="9" fill="#555555">PyTorch-ready views</text>
</svg>
