site_name: fdia-graph
site_description: A Python package that builds attacked measurement timelines on power-grid test systems, with a second toolkit to analyse them. Download a ready timeline or generate your own.
site_url: https://fdia.artecommercellc.com
repo_url: https://github.com/myersben9/fdia-graph
repo_name: myersben9/fdia-graph
docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/transmission-tower
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - Load a dataset: getting-started/load.md
      - Generate your first timeline: getting-started/generate.md
      - Analyse a timeline: getting-started/analyse.md
  - How-to guides:
      - Install and data versions: guides/install.md
      - Generate a timeline: guides/generation.md
      - Build the operating points: guides/operating_points.md
      - Estimate the state: guides/state_estimation.md
      - Add a design family, an alarm rule or a test system: guides/extending.md
      - Check the package yourself: guides/verify.md
      - Troubleshooting: guides/troubleshooting.md
  - Concepts:
      - How the package flows: concepts/flow.md
      - Test systems: concepts/test_systems.md
      - Solving: concepts/solving.md
      - Meters and noise: concepts/meters.md
      - The attack families: concepts/attacks.md
      - Layers and labels: concepts/layers.md
  - Studies:
      - State estimation: analysis/estimation/README.md
      - Localization: analysis/localization/README.md
      - Trusted meters: analysis/trust/README.md
      - Federated: analysis/federated/README.md
  - Reference:
      - Data dictionary: reference/DATA_DICTIONARY.md
      - Glossary: reference/GLOSSARY.md
      - Modules: reference/MODULES.md
      - Concepts to code: reference/CONCEPTS_TO_CODE.md
      - Architecture (UML diagrams): reference/CLASS_MAP.md
      - Examples: reference/EXAMPLES.md
      - Formulas: reference/FORMULAS.md
      - Benchmarks: reference/BENCHMARKS.md
      - References: reference/REFERENCES.md
  - Contributing:
      - Contributing: contributing.md
      - Review checklist: reference/REVIEW_CHECKLIST.md
  - Changelog: changelog.md

extra:
  # the version picker reads versions.json at the site root, which mike writes on the
  # versioned deploy (GitHub Pages); on a build without it the picker stays hidden
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fdia-graph/
    - icon: fontawesome/brands/github
      link: https://github.com/myersben9/fdia-graph
