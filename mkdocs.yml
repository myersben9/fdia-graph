site_name: fdia-graph
site_description: Stealthy FDIA localization datasets for power grids, PyTorch-ready in one line
site_url: https://fdia.artecommercellc.com
repo_url: https://github.com/myersben9/fdia-graph
repo_name: myersben9/fdia-graph
docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/transmission-tower
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Roadmap: ROADMAP.md
  - Modules:
      - State estimation: se/README.md
      - Localization: localization/README.md
      - Trusted meters: trust/README.md
      - Federated: federated/README.md
  - Guides:
      - Timeline generation: guides/generation.md
      - State estimation: guides/state_estimation.md
  - Reference:
      - Data dictionary: reference/DATA_DICTIONARY.md
      - Glossary: reference/GLOSSARY.md
      - Concepts to code: reference/CONCEPTS_TO_CODE.md
      - Architecture (UML diagrams): reference/CLASS_MAP.md
      - Examples: reference/EXAMPLES.md
      - Formulas: reference/FORMULAS.md
      - Benchmarks: reference/BENCHMARKS.md
      - References: reference/REFERENCES.md
  - Plans:
      - Overview: plans/README.md
      - One dataset: plans/ONE_DATASET_PLAN.md
      - Data models: plans/DATA_MODELS_PLAN.md
      - Field groups: plans/FIELD_GROUPS_PLAN.md
      - Readability: plans/READABILITY_PLAN.md
      - Restructure: plans/RESTRUCTURE_PLAN.md
  - Contributing: contributing.md
  - Changelog: changelog.md

extra:
  # the version picker reads versions.json at the site root, which mike writes on the
  # versioned deploy (GitHub Pages); on a build without it the picker stays hidden
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fdia-graph/
    - icon: fontawesome/brands/github
      link: https://github.com/myersben9/fdia-graph
